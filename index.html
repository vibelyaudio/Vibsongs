<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBox Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #141721;
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.4);
      --text-main: #f0f3f8;
      --text-muted: #8a99ad;
      --star: #ffb703;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }
    .logo span { color: var(--accent); }
    .search-bar {
      background: #191c28;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      width: 280px;
      transition: all 0.3s;
    }
    .search-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 0.9rem;
    }

    /* Hero Banner */
    .hero {
      position: relative;
      height: 60vh;
      min-height: 400px;
      display: flex;
      align-items: flex-end;
      padding: 5%;
      background: linear-gradient(180deg, rgba(9, 10, 15, 0.2) 0%, var(--bg) 98%), 
                  url('https://image.tmdb.org/t/p/original/tElnmtQ6yszej5G9vAdtc49cBEg.jpg') center/cover no-drop;
    }
    .hero-content {
      max-width: 600px;
      z-index: 2;
    }
    .hero-badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--accent);
      color: #000;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 4px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #050a14;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.2s;
    }
    .hero-btn:hover { transform: scale(1.05); }

    /* Content Area */
    main { padding: 30px 5%; }
    .section-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 20px;
      position: relative;
      padding-left: 12px;
    }
    .section-title::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15%;
      height: 70%;
      width: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 12px var(--accent-glow);
    }
    .movie-card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      display: block;
    }
    .rating-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(14, 16, 24, 0.85);
      backdrop-filter: blur(5px);
      color: var(--star);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .movie-info {
      padding: 12px;
    }
    .movie-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-year {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 4px;
    }

    /* Video Player Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 860px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 1.8rem;
      color: #fff;
      cursor: pointer;
      z-index: 10;
    }
    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Movie<span>Box</span></div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search movies, series...">
    </div>
  </header>

  <section class="hero" id="heroBanner">
    <div class="hero-content">
      <div class="hero-badge">FEATURED</div>
      <h1 id="heroTitle">Featured Movie</h1>
      <p id="heroDesc">Explore high-quality movies and trending series right now.</p>
      <button class="hero-btn" id="heroPlayBtn">▶ Play Now</button>
    </div>
  </section>

  <main>
    <div class="section-title" id="sectionHeading">Popular Movies</div>
    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <div class="player-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // TMDB API credentials (themoviedb.org-ൽ നിന്ന് ഫ്രീയായി ലഭിക്കുന്നത്)
    const API_KEY = "830c25ad27c9cbe778b7d903aa51e605"; // ഡെമോ API കീ
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_URL = "https://image.tmdb.org/t/p/original";

    const movieGrid = document.getElementById('movieGrid');
    const searchInput = document.getElementById('searchInput');
    const heroBanner = document.getElementById('heroBanner');
    const heroTitle = document.getElementById('heroTitle');
    const heroDesc = document.getElementById('heroDesc');
    const heroPlayBtn = document.getElementById('heroPlayBtn');
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const closeModal = document.getElementById('closeModal');
    const sectionHeading = document.getElementById('sectionHeading');

    let featuredMovieId = null;

    // Fetch popular movies
    async function loadMovies(url, isSearch = false) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.results && data.results.length > 0) {
          if (!isSearch) {
            setupHero(data.results[0]);
          }
          displayMovies(data.results);
        } else {
          movieGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No movies found.</p>`;
        }
      } catch (err) {
        console.error("API Error: ", err);
      }
    }

    function setupHero(movie) {
      featuredMovieId = movie.id;
      heroTitle.textContent = movie.title;
      heroDesc.textContent = movie.overview || "No description available.";
      if (movie.backdrop_path) {
        heroBanner.style.backgroundImage = `linear-gradient(180deg, rgba(9, 10, 15, 0.2) 0%, var(--bg) 98%), url('${BACKDROP_URL + movie.backdrop_path}')`;
      }
    }

    function displayMovies(movies) {
      movieGrid.innerHTML = '';
      movies.forEach(movie => {
        if (!movie.poster_path) return;

        const card = document.createElement('div');
        card.classList.add('movie-card');
        card.innerHTML = `
          <img src="${IMG_URL + movie.poster_path}" alt="${movie.title}" loading="lazy">
          <div class="rating-badge">★ ${(movie.vote_average || 0).toFixed(1)}</div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-year">${(movie.release_date || '').split('-')[0]}</div>
          </div>
        `;

        card.addEventListener('click', () => openStream(movie.id));
        movieGrid.appendChild(card);
      });
    }

    // Embed player ലോഡ് ചെയ്യൽ
    function openStream(tmdbId) {
      // Third-party embed API വഴി TMDB ID വെച്ച് പ്ലെയർ കണക്റ്റ് ചെയ്യുന്നു
      videoPlayer.src = `https://vidsrc.to/embed/movie/${tmdbId}`;
      videoModal.style.display = 'flex';
    }

    heroPlayBtn.addEventListener('click', () => {
      if (featuredMovieId) openStream(featuredMovieId);
    });

    closeModal.addEventListener('click', () => {
      videoModal.style.display = 'none';
      videoPlayer.src = '';
    });

    // Modal പുറത്ത് ക്ലിക്ക് ചെയ്താൽ ക്ലോസ് ആവാൻ
    window.addEventListener('click', (e) => {
      if (e.target === videoModal) {
        videoModal.style.display = 'none';
        videoPlayer.src = '';
      }
    });

    // Real-time search handler
    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();

      searchTimeout = setTimeout(() => {
        if (query) {
          sectionHeading.textContent = `Search results for "${query}"`;
          loadMovies(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}`, true);
        } else {
          sectionHeading.textContent = "Popular Movies";
          loadMovies(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
        }
      }, 500);
    });

    // Initial load
    loadMovies(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
  </script>
</body>
</html>
