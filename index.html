    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .eq-container { display: flex; align-items: flex-end; gap: 2px; height: 14px; width: 16px; margin: 0 auto; }
        .eq-bar { width: 3px; background-color: #000; border-radius: 1px; animation: eq 0.8s ease-in-out infinite; }
        .eq-bar:nth-child(1) { animation-delay: 0s; }
        .eq-bar:nth-child(2) { animation-delay: -0.4s; }
        .eq-bar:nth-child(3) { animation-delay: -0.2s; }
        @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -4px; opacity: 0; transition: opacity 0.2s;
        }
        input[type=range]:hover::-webkit-slider-thumb { opacity: 1; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 2px;
        }
        input[type=range]:hover::-webkit-slider-runnable-track { background: #1DB954; }
        
        .hidden-view { display: none !important; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

            authDomain: "vibely-488d8.firebaseapp.com",

            storageBucket: "vibely-488d8.firebasestorage.app",

    <script>
        let currentPlaylist = [];
        let currentIndex = -1;
        let isPlaying = false;
        let likedSongs = []; // This will now hold the songs loaded from DB
        let activeView = 'home';
        let errorCount = 0;

        const audio = document.getElementById('audio-player');
        
        const API_SERVERS = [
            'https://saavn.dev/api/search/songs?query=',
            'https://jiosaavn-api-v3.vercel.app/result/?query=',
            'https://jiosavan-api.vercel.app/result/?query=',
            'https://saavnapi-nine.vercel.app/result/?query='
        ];

        async function fetchWithFallback(query) {
            for (let server of API_SERVERS) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    const res = await fetch(`${server}${encodeURIComponent(query)}&limit=30`, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (!res.ok) continue;
                    const data = await res.json();
                    
                    let songs = [];
                    if (data.data && Array.isArray(data.data.results)) songs = data.data.results;
                    else if (Array.isArray(data)) songs = data;
                    else if (data.results) songs = data.results;

                    if (songs.length > 0) return songs;
                } catch (e) { }
            }
            return [];
        }

        function getPlaceholderImage(title) {
            const colors = ['#1DB954', '#1ed760', '#1aa34a', '#282828', '#121212'];
            const hash = title.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const color1 = colors[hash % colors.length];
            const color2 = colors[(hash + 1) % colors.length];
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${color1}"/><stop offset="100%" stop-color="${color2}"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><text x="150" y="150" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">${title.substring(0, 20)}</text></svg>`)}`;
        }

        function removeDuplicates(tracks) {
            const seenTitles = new Set();
            return tracks.filter(track => {
                let rawTitle = (track.song || track.name || track.title || '').toLowerCase();
                rawTitle = rawTitle.replace(/\(.*?\)|\[.*?\]/g, '')
                                   .replace(/remix/gi, '')
                                   .replace(/from\s+.*/g, '')
                                   .replace(/[^a-z0-9]/g, '')
                                   .trim();
                if (!rawTitle || seenTitles.has(rawTitle)) return false;
                seenTitles.add(rawTitle);
                return true;
            });
        }

        async function fetchTrending() {
            const queries = [
                'malayalam hits 2024', 'tamil hits 2024', 'hindi hits 2024', 'english pop hits', 
                'punjabi hits', 'telugu hits', 'lofi chill', 'trending songs'
            ];
            const promises = queries.map(q => fetchWithFallback(q));
            const results = await Promise.all(promises);
            let allTracks = results.flat();
            const uniqueTracks = removeDuplicates(allTracks);
            return uniqueTracks.slice(0, 100);
        }

        async function initApp() {
            document.getElementById('homeGrid').innerHTML = `<div class="col-span-full text-center py-10"><i class="fa-solid fa-spinner fa-spin text-spotify-green text-2xl"></i><p class="text-gray-400 mt-2 text-sm">Loading 100+ songs...</p></div>`;
            currentPlaylist = await fetchTrending();
            renderGrid(currentPlaylist, 'homeGrid');
        }

        function getImage(track) {
            if (track.image) {
                if (typeof track.image === 'string') return track.image;
                if (Array.isArray(track.image) && track.image.length > 0) return track.image[track.image.length - 1].url;
            }
            return getPlaceholderImage(track.song || track.name || track.title || 'Music');
        }

        function getAudioUrl(track) {
            if (track.media_url) return track.media_url;
            if (track.downloadUrl && track.downloadUrl.length > 0) return track.downloadUrl[track.downloadUrl.length - 1].url;
            return null;
        }

        function getArtistName(track) {
            return track.primary_artists || track.artists?.primary?.map(a => a.name).join(', ') || "Unknown Artist";
        }

        function getSongName(track) {
            return track.song || track.name || track.title || "Unknown Song";
        }

        function renderGrid(tracks, containerId) {
            const grid = document.getElementById(containerId);
            if (!tracks || tracks.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10"><i class="fa-solid fa-music text-gray-600 text-4xl mb-3"></i><p class="text-gray-400">No songs found.</p></div>`;
                return;
            }

            grid.innerHTML = tracks.map((track, index) => {
                const cover = getImage(track);
                const songName = getSongName(track);
                const artist = getArtistName(track);
                // Use string comparison for IDs to be safe
                const isCurrent = currentPlaylist[currentIndex]?.id === track.id;
                
                const playIconHTML = (isCurrent && isPlaying) 
                    ? `<div class="eq-container"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>`
                    : `<i class="fa-solid fa-play text-sm ml-0.5"></i>`;

                return `
                    <div class="bg-[#181818] hover:bg-[#282828] p-3 md:p-4 rounded-md transition duration-200 cursor-pointer group relative" onclick="playFromQueue('${containerId}', ${index})">
                        <div class="relative mb-3">
                            <img src="${cover}" class="w-full aspect-square object-cover rounded-md shadow-lg">
                            <div class="absolute bottom-2 right-2 w-10 h-10 rounded-full flex items-center justify-center shadow-xl transition-all duration-200 
                                ${isCurrent ? 'bg-spotify-green text-black opacity-100 translate-y-0' : 'bg-spotify-green text-black opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0'}">
                                ${playIconHTML}
                            </div>
                        </div>
                        <h3 class="font-bold text-sm truncate ${isCurrent ? 'text-spotify-green' : 'text-white'}">${songName}</h3>
                        <p class="text-spotify-textSub text-xs mt-1 truncate">${artist}</p>
                    </div>
                `;
            }).join('');
        }

        function playFromQueue(containerId, index) {
            if (containerId === 'homeGrid') currentPlaylist = currentPlaylist;
            else if (containerId === 'likedGrid') currentPlaylist = likedSongs;
            currentIndex = index;
            loadAndPlay(currentPlaylist[index]);
        }

        function loadAndPlay(track) {
            if (!track) return;
            const streamUrl = getAudioUrl(track);
            
            if(!streamUrl) {
                playNext();
                return;
            }

            audio.src = streamUrl;
            
            document.getElementById('player-title').innerText = getSongName(track);
            document.getElementById('player-artist').innerText = getArtistName(track);
            document.getElementById('player-thumb').src = getImage(track);
            
            document.getElementById('like-btn').classList.remove('hidden');
            updateLikeIcon(track.id);

            audio.play().then(() => {
                isPlaying = true;
                errorCount = 0;
                updateUI();
            }).catch((e) => {
                if(errorCount < 3) {
                    errorCount++;
                    playNext();
                }
            });
        }

        audio.addEventListener('error', (e) => {
            if (errorCount < 3 && currentPlaylist.length > 1) {
                errorCount++;
                setTimeout(playNext, 1000); 
            } else {
                isPlaying = false;
                updateUI();
            }
        });

        function togglePlayPause() {
            if (!audio.src) return;
            if (isPlaying) { audio.pause(); isPlaying = false; } 
            else { audio.play(); isPlaying = true; }
            updateUI();
        }

        function playNext() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            loadAndPlay(currentPlaylist[currentIndex]);
        }

        function playPrevious() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            loadAndPlay(currentPlaylist[currentIndex]);
        }

        function updateUI() {
            const icon = document.getElementById('play-pause-icon');
            icon.className = isPlaying ? "fa-solid fa-pause text-xs md:text-sm" : "fa-solid fa-play text-xs md:text-sm ml-0.5";
            
            if (activeView === 'home') renderGrid(currentPlaylist, 'homeGrid');
            else if (activeView === 'liked') renderGrid(likedSongs, 'likedGrid');
            else if (activeView === 'search') renderGrid(currentPlaylist, 'searchGrid');
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            
            document.getElementById('progress-bar').value = progress;
            document.getElementById('current-time').innerText = formatTime(audio.currentTime);
            
            document.getElementById('progress-bar-mob').value = progress;
            document.getElementById('current-time-mob').innerText = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            const timeStr = formatTime(audio.duration);
            document.getElementById('duration').innerText = timeStr;
            document.getElementById('duration-mob').innerText = timeStr;
        });
        
        audio.addEventListener('ended', playNext);

        document.getElementById('progress-bar').addEventListener('input', (e) => {
            if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
        });
        
        document.getElementById('progress-bar-mob').addEventListener('input', (e) => {
            if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
        });

        document.getElementById('volume-bar')?.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        async function handleSearch(query) {
            if (!query.trim()) return;
            navigate('search');
            document.getElementById('searchHeading').innerText = `Results for "${query}"`;
            document.getElementById('searchGrid').innerHTML = `<div class="col-span-full text-center py-10"><i class="fa-solid fa-spinner fa-spin text-spotify-green text-2xl"></i></div>`;
            
            let results = await fetchWithFallback(query);
            results = removeDuplicates(results);
            
            currentPlaylist = results;
            renderGrid(results, 'searchGrid');
        }

        function navigate(view) {
            activeView = view;
            ['home', 'search', 'liked'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden-view');
                const dNav = document.getElementById(`nav-${v}`);
                if(dNav) { dNav.classList.remove('text-white'); dNav.classList.add('text-spotify-textSub'); }
                
                const mNav = document.getElementById(`mnav-${v}`);
                if(mNav) {
                    mNav.classList.remove('text-white');
                    mNav.classList.add('text-spotify-textSub');
                    if(v === 'liked') mNav.querySelector('i').className = "fa-regular fa-heart text-lg mb-1";
                }
            });

            document.getElementById(`view-${view}`).classList.remove('hidden-view');
            
            const activeDNav = document.getElementById(`nav-${view}`);
            if(activeDNav) { activeDNav.classList.remove('text-spotify-textSub'); activeDNav.classList.add('text-white'); }

            const activeMNav = document.getElementById(`mnav-${view}`);
            if(activeMNav) {
                activeMNav.classList.remove('text-spotify-textSub');
                activeMNav.classList.add('text-white');
                if(view === 'liked') activeMNav.querySelector('i').className = "fa-solid fa-heart text-lg mb-1";
            }
            
            if (view === 'liked') renderGrid(likedSongs, 'likedGrid');
        }

        function switchAuthMode(mode) {
            document.getElementById('loginForm').classList.toggle('hidden', mode === 'signup');
            document.getElementById('signupForm').classList.toggle('hidden', mode === 'login');
            document.getElementById('authTitle').innerText = mode === 'signup' ? 'Sign Up' : 'Welcome to VIBELY';
        }

        async function handleSignupSubmit() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            if (!name || !email || !password) return alert("Please fill all fields");

            try {
                const userCred = await window.createUserWithEmailAndPassword(window.auth, email, password);
                await window.setDoc(window.doc(window.db, "users", userCred.user.uid), { 
                    name: name, 
                    email: email, 
                    favorites: [] 
                });
            } catch (e) { alert("Signup failed: " + e.message); }
        }

        async function handleLoginSubmit() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
            } catch (e) { alert("Login failed: Invalid credentials"); }
        }

        async function handleLogout() {
            await window.signOut(window.auth);
            location.reload();
        }

        // === FIX 2: PROPER SAVING LOGIC ===
        async function toggleLikeCurrent() {
            if (currentIndex === -1 || !currentPlaylist[currentIndex]) return;
            
            const track = currentPlaylist[currentIndex];
            const trackId = String(track.id); // Ensure string comparison
            
            const isLiked = likedSongs.some(t => String(t.id) === trackId);
            
            if (isLiked) {
                likedSongs = likedSongs.filter(t => String(t.id) !== trackId);
            } else {
                // Save only necessary fields to save database space
                const trackToSave = {
                    id: trackId,
                    song: getSongName(track),
                    name: getSongName(track), // Compatibility
                    primary_artists: getArtistName(track),
                    artists: track.artists,
                    image: getImage(track),
                    media_url: getAudioUrl(track),
                    downloadUrl: track.downloadUrl
                };
                likedSongs.push(trackToSave);
            }
            
            updateLikeIcon(trackId);
            if(activeView === 'liked') renderGrid(likedSongs, 'likedGrid');

            // Save to Firebase Firestore
            if (window.currentUid) {
                try {
                    await window.updateDoc(window.doc(window.db, "users", window.currentUid), { 
                        favorites: likedSongs 
                    });
                    console.log("Successfully saved to database!");
                } catch (e) {
                    console.error("Database Error:", e);
                    alert("Error saving to database. Please check console.");
                }
            }
        }

        function updateLikeIcon(trackId) {
            const isLiked = likedSongs.some(t => String(t.id) === String(trackId));
            document.getElementById('like-icon').className = isLiked ? "fa-solid fa-heart text-lg text-spotify-green" : "fa-regular fa-heart text-lg";
        }
    </script>
</body>
</html>
