<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vibely — YouTube Music Player</title>
<meta name="theme-color" content="#0a0a0f" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='black'/><path d='M30 65V45c0-11 9-20 20-20s20 9 20 20v20' fill='none' stroke='%231ed760' stroke-width='8'/><rect x='25' y='55' width='12' height='20' rx='4' fill='%231ed760'/><rect x='63' y='55' width='12' height='20' rx='4' fill='%231ed760'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --bg-elev: #12121a;
    --bg-elev2: #1c1c28;
    --bg-hover: #26263a;
    --text: #f5f5f7;
    --text-dim: #9b9bb0;
    --text-faint: #6b6b80;
    --accent: #1ed760;
    --accent-hover: #3be477;
    --border: #22222f;
    --sidebar-w: 248px;
    --player-h: 100px; /* Increased for video */
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  ::selection { background: var(--accent); color: black; }

  #app {
    display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: 1fr var(--player-h);
    height: 100vh; gap: 8px; padding: 8px 8px 0;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    background: var(--bg-elev); border-radius: 12px; padding: 20px 12px;
    display: flex; flex-direction: column; gap: 6px; overflow-y: auto; overflow-x: hidden;
  }
  .logo { display: flex; align-items: center; gap: 12px; padding: 4px 12px 20px; font-weight: 900; font-size: 24px; cursor: pointer; }
  .logo-mark { width: 36px; height: 36px; background: #000; border: 1.5px solid var(--accent); border-radius: 10px; display: grid; place-items: center; color: var(--accent); box-shadow: 0 0 15px rgba(30, 215, 96, 0.2); }
  .logo-mark svg { width: 20px; height: 20px; stroke-width: 2.5; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 8px; color: var(--text-dim); font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item:hover { color: var(--text); background: var(--bg-hover); }
  .nav-item.active { color: var(--text); background: var(--bg-hover); }
  .nav-item.active svg { color: var(--accent); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 12px 0; }
  .sidebar-heading { padding: 6px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-faint); font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .playlist-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
  .playlist-item:hover { background: var(--bg-hover); }
  .playlist-thumb { width: 36px; height: 36px; border-radius: 6px; background: var(--bg-elev2); border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-dim); }
  .sidebar-upload { margin-top: auto; padding: 12px; border: 1px dashed var(--border); border-radius: 10px; display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 12.5px; cursor: pointer; font-weight: 600; justify-content: center; }
  .sidebar-upload:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- Main ---------- */
  #main { background: var(--bg-elev); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; background: rgba(18, 18, 26, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); gap: 16px; flex-shrink: 0; }
  .search-wrap { display: flex; align-items: center; gap: 10px; background: var(--bg-elev2); border-radius: 999px; padding: 9px 16px; width: 100%; max-width: 440px; }
  .search-wrap input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; }
  #content { flex: 1; overflow-y: auto; padding: 24px 24px 60px; }
  
  .section-title { font-size: 22px; font-weight: 800; margin-bottom: 16px; }
  .greeting { font-size: 30px; font-weight: 900; margin-bottom: 24px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .card { background: var(--bg-elev2); border-radius: 10px; padding: 14px; cursor: pointer; transition: background 0.2s; position: relative; }
  .card:hover { background: #23233a; }
  .card-cover { width: 100%; aspect-ratio: 1; border-radius: 8px; margin-bottom: 12px; position: relative; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; }
  .card-play { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: black; opacity: 0; transform: translateY(6px); transition: all 0.2s; }
  .card:hover .card-play { opacity: 1; transform: translateY(0); }
  .card-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Track list ---------- */
  .track-list { display: flex; flex-direction: column; }
  .track-row { display: grid; grid-template-columns: 28px 48px 1fr 60px 40px; align-items: center; gap: 14px; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background 0.1s; }
  .track-row:hover { background: var(--bg-hover); }
  .track-row.playing { color: var(--accent); }
  .track-num { color: var(--text-faint); text-align: right; }
  .track-row:hover .track-num { display: none; }
  .track-row .row-play { display: none; color: var(--text); }
  .track-row:hover .row-play { display: block; }
  .track-cover { width: 40px; height: 40px; border-radius: 4px; background-size: cover; background-position: center; }
  .track-info { min-width: 0; }
  .track-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-dur { color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq span { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .eq span:nth-child(1) { animation-delay: -0.4s; }
  .eq span:nth-child(2) { animation-delay: -0.7s; }
  .eq span:nth-child(3) { animation-delay: -0.2s; }
  @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }

  /* ---------- Player ---------- */
  #player {
    grid-column: 1 / -1; background: var(--bg-elev); border-radius: 12px 12px 0 0;
    display: grid; grid-template-columns: 1fr 2fr 1fr; align-items: center;
    padding: 0 16px; gap: 16px; border-top: 1px solid var(--border); z-index: 10;
  }
  .player-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  
  /* YouTube Video Container */
  .yt-video-container {
    width: 100px; height: 75px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .yt-video-container iframe { width: 100%; height: 100%; border: none; }

  .player-meta { min-width: 0; flex: 1; }
  .player-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-artist { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; max-width: 600px; margin: 0 auto; }
  .player-controls { display: flex; align-items: center; gap: 16px; }
  .ctl { color: var(--text-dim); transition: all 0.15s; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; }
  .ctl:hover { color: var(--text); }
  .play-btn { width: 34px; height: 34px; background: white; border-radius: 50%; display: grid; place-items: center; color: black; transition: transform 0.1s; }
  .play-btn:hover { transform: scale(1.06); }

  .progress-wrap { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .seek { position: relative; flex: 1; height: 4px; background: #2a2a3a; border-radius: 2px; cursor: pointer; }
  .seek-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--text); border-radius: 2px; width: 0; pointer-events: none; }
  .seek:hover .seek-fill { background: var(--accent); }
  
  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    #app { grid-template-columns: 72px 1fr; }
    .logo span, .nav-item span, .sidebar-heading, .playlist-meta, .sidebar-upload span { display: none; }
    .nav-item { justify-content: center; padding: 14px; }
    .playlist-item { justify-content: center; }
    .track-row { grid-template-columns: 28px 40px 1fr 40px; }
    .track-dur { display: none; }
    #player { grid-template-columns: 1fr auto; }
    .player-right { display: none; }
    .yt-video-container { width: 70px; height: 50px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="topbar">
      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-input" placeholder="Search songs, artists..." autocomplete="off" />
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<footer id="player">
  <div class="player-left">
    <!-- YouTube Video Player Wrapper -->
    <div class="yt-video-container" id="yt-wrapper">
      <div id="yt-player"></div>
    </div>
    <div class="player-meta">
      <div class="player-title" id="p-title">Nothing playing</div>
      <div class="player-artist" id="p-artist">Pick a track to start</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button class="ctl" id="ctl-prev" title="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="ctl-play" title="Play">
        <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctl" id="ctl-next" title="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div class="progress-wrap">
      <span class="time-label" id="time-now">0:00</span>
      <div class="seek" id="seek">
        <div class="seek-fill" id="seek-fill"></div>
      </div>
      <span class="time-label right" id="time-total">0:00</span>
    </div>
  </div>
  <div class="player-right"></div>
</footer>

<!-- YouTube IFrame API Script -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* =========================================================
   VIBELY — YouTube Music Integration
   ========================================================= */

const I = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
  library: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M8 19V5M12 19V5M20 6l-4 14"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  music: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  pause: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`
};
const svg = (name, size = 20) => `<span style="width:${size}px;height:${size}px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0">${I[name]}</span>`;

const STATE = {
  view: 'home', param: null, search: '',
  tracks: [], history: [],
  player: { queue: [], index: -1, playing: false }
};

// Real YouTube Video IDs for Demo
const DEMO = [
  { id: 'yt1', title: 'Shape of You', artist: 'Ed Sheeran', ytId: 'JGwWNGJdvx8', duration: 263 },
  { id: 'yt2', title: 'Blinding Lights', artist: 'The Weeknd', ytId: '4NRXx6U8ABQ', duration: 262 },
  { id: 'yt3', title: 'Perfect', artist: 'Ed Sheeran', ytId: '2Vv-BfVoq4g', duration: 279 },
  { id: 'yt4', title: 'Believer', artist: 'Imagine Dragons', ytId: '7wtfhZwyrcc', duration: 217 },
  { id: 'yt5', title: 'Levitating', artist: 'Dua Lipa', ytId: 'TUVcZfQe-Kw', duration: 203 },
  { id: 'yt6', title: 'Stay', artist: 'The Kid LAROI, Justin Bieber', ytId: 'kTJczUoc26U', duration: 141 },
  { id: 'yt7', title: 'Bad Habits', artist: 'Ed Sheeran', ytId: 'orJSJGHjBLI', duration: 231 },
  { id: 'yt8', title: 'Save Your Tears', artist: 'The Weeknd', ytId: 'XXYlFuWEuKI', duration: 215 }
];

const PALETTES = [
  ['#8b5cf6', '#ec4899'], ['#06b6d4', '#3b82f6'], ['#f59e0b', '#ef4444'],
  ['#10b981', '#059669'], ['#f43f5e', '#8b5cf6'], ['#3b82f6', '#8b5cf6']
];
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function getCoverStyle(seed) { const p = PALETTES[hashStr(seed) % PALETTES.length]; return `background: linear-gradient(135deg, ${p[0]}, ${p[1]});`; }

const $ = sel => document.querySelector(sel);
const fmtTime = s => { if (!s || !isFinite(s)) return '0:00'; return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* =========================================
   YOUTUBE PLAYER SETUP
   ========================================= */
let ytPlayer;
let progressInterval;

// This function is called automatically by the YouTube API
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '100%',
    width: '100%',
    videoId: '', // Empty initially
    playerVars: {
      'playsinline': 1,
      'controls': 0, // Hide YouTube controls (we use our own)
      'disablekb': 1,
      'fs': 0,
      'modestbranding': 1,
      'rel': 0
    },
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange
    }
  });
}

function onPlayerReady(event) {
  // Player is ready
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.PLAYING) {
    STATE.player.playing = true;
    updatePlayIcon();
    startProgressTracker();
  } else if (event.data === YT.PlayerState.PAUSED) {
    STATE.player.playing = false;
    updatePlayIcon();
  } else if (event.data === YT.PlayerState.ENDED) {
    nextTrack();
  }
}

function startProgressTracker() {
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (ytPlayer && ytPlayer.getCurrentTime) {
      const current = ytPlayer.getCurrentTime();
      const total = ytPlayer.getDuration();
      if (total > 0) {
        $('#seek-fill').style.width = (current / total * 100) + '%';
        $('#time-now').textContent = fmtTime(current);
        $('#time-total').textContent = fmtTime(total);
      }
    }
  }, 1000);
}

/* =========================================
   APP LOGIC
   ========================================= */

function setQueue(ids, startId) {
  if (!ids.length) return;
  STATE.player.queue = [...ids];
  STATE.player.index = Math.max(0, ids.indexOf(startId));
  playCurrent();
}

function playCurrent() {
  const t = STATE.tracks.find(x => x.id === STATE.player.queue[STATE.player.index]);
  if (!t || !ytPlayer) return;
  
  ytPlayer.loadVideoById(t.ytId);
  
  $('#p-title').textContent = t.title;
  $('#p-artist').textContent = t.artist;
  
  addToHistory(t.id);
  updateAllTrackRows();
}

function togglePlay() {
  if (!ytPlayer || !ytPlayer.playVideo) return;
  if (STATE.player.playing) { ytPlayer.pauseVideo(); }
  else { ytPlayer.playVideo(); }
}

function nextTrack() {
  let i = STATE.player.index + 1;
  if (i >= STATE.player.queue.length) i = 0; // Loop
  STATE.player.index = i;
  playCurrent();
}

function prevTrack() {
  if (ytPlayer && ytPlayer.getCurrentTime() > 3) { ytPlayer.seekTo(0); return; }
  let i = STATE.player.index - 1;
  if (i < 0) i = STATE.player.queue.length - 1;
  STATE.player.index = i;
  playCurrent();
}

function addToHistory(id) {
  STATE.history = [id, ...STATE.history.filter(x => x !== id)].slice(0, 50);
}

/* =========================================
   UI RENDERING
   ========================================= */

function renderSidebar() {
  const active = (v) => STATE.view === v ? 'active' : '';
  $('#sidebar').innerHTML = `
    <div class="logo" onclick="navigate('home')">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg></div>
      <span>Vibely</span>
    </div>
    <div class="nav-item ${active('home')}" onclick="navigate('home')">${svg('home', 20)}<span>Home</span></div>
    <div class="nav-item ${active('search')}" onclick="navigate('search')">${svg('search', 20)}<span>Search</span></div>
    <div class="nav-item ${active('library')}" onclick="navigate('library')">${svg('library', 20)}<span>Library</span></div>
    <div class="sidebar-divider"></div>
    <div class="nav-item ${active('recently')}" onclick="navigate('recently')">${svg('clock', 20)}<span>History</span></div>
  `;
}

function renderContent() {
  const el = $('#content');
  if (STATE.view === 'home') {
    el.innerHTML = `
      <div class="greeting">Good ${new Date().getHours() < 12 ? 'morning' : 'afternoon'} 👋</div>
      <div class="section-title">Made for you (YouTube Hits)</div>
      <div class="card-grid">
        ${STATE.tracks.map(t => `
          <div class="card">
            <div class="card-cover" style="${getCoverStyle(t.id)}">
              ${svg('music', 40)}
              <button class="card-play" onclick="setQueue(STATE.tracks.map(x=>x.id), '${t.id}')">${svg('play', 18)}</button>
            </div>
            <div class="card-title">${esc(t.title)}</div>
            <div class="card-sub">${esc(t.artist)}</div>
          </div>
        `).join('')}
      </div>
    `;
  } else if (STATE.view === 'recently') {
    el.innerHTML = `<div class="section-title">Recently Played</div><div class="track-list">
      ${STATE.history.map(id => STATE.tracks.find(t => t.id === id)).filter(Boolean).map((t, i) => `
        <div class="track-row" onclick="setQueue(STATE.history, '${t.id}')">
          <div class="track-num">${i+1}</div>
          <div class="track-cover" style="${getCoverStyle(t.id)}"></div>
          <div class="track-info"><div class="track-title">${esc(t.title)}</div><div class="track-artist">${esc(t.artist)}</div></div>
          <div class="track-dur">${fmtTime(t.duration)}</div>
        </div>
      `).join('')}
    </div>`;
  } else {
    el.innerHTML = `<div class="greeting">Coming Soon...</div>`;
  }
}

function updatePlayIcon() {
  const iconEl = $('#play-icon');
  if (STATE.player.playing) iconEl.innerHTML = `<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>`;
  else iconEl.innerHTML = `<path d="M8 5v14l11-7z"/>`;
}

function updateAllTrackRows() {
  // Sync UI if needed
}

function navigate(view) {
  STATE.view = view;
  renderSidebar(); renderContent();
}

$('#ctl-play').addEventListener('click', togglePlay);
$('#ctl-next').addEventListener('click', nextTrack);
$('#ctl-prev').addEventListener('click', prevTrack);
$('#seek').addEventListener('click', e => {
  if (!ytPlayer || !ytPlayer.getDuration) return;
  const rect = $('#seek').getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  ytPlayer.seekTo(pct * ytPlayer.getDuration(), true);
});

function init() {
  STATE.tracks = DEMO;
  renderSidebar(); renderContent();
}

init();
</script>
</body>
</html>
