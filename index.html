<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBox Pro - Stream & Download</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap">
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #151821;
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.4);
      --download-green: #00e676;
      --text-main: #f5f6fa;
      --text-muted: #8c9ba5;
      --star: #ffb703;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 5%;
      background: rgba(11, 12, 16, 0.95);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
    }
    .logo span { color: var(--accent); }

    .search-box {
      background: #1c1f2b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      padding: 8px 16px;
      width: 240px;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 0.85rem;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      padding: 12px 5%;
      background: #10121a;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: #181c28;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 7px 18px;
      border-radius: 20px;
      transition: all 0.25s;
    }
    .filter-btn.active, .filter-btn:hover {
      color: #0b0c10;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .hero {
      position: relative;
      height: 55vh;
      min-height: 380px;
      display: flex;
      align-items: flex-end;
      padding: 5%;
      background-size: cover;
      background-position: center top;
      transition: background 0.5s ease;
    }
    .hero-content {
      max-width: 650px;
      z-index: 2;
    }
    .hero-tag {
      background: var(--accent);
      color: #0b0c10;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 8px;
    }
    .hero h1 { font-size: 2.2rem; margin-bottom: 8px; line-height: 1.2; }
    .hero p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      border: none;
      padding: 10px 22px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .play-btn {
      background: var(--accent);
      color: #0b0c10;
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    .download-btn {
      background: var(--download-green);
      color: #05140b;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
    }
    .action-btn:hover { transform: scale(1.05); }

    main { padding: 25px 5%; }
    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 18px;
    }
    .movie-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
    }
    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 10px var(--accent-glow);
    }
    .poster-wrap {
      position: relative;
      cursor: pointer;
    }
    .movie-card img {
      width: 100%;
      height: 245px;
      object-fit: cover;
      display: block;
    }
    .rating-badge {
      position: absolute;
      top: 8px; right: 8px;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(5px);
      color: var(--star);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .lang-badge {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(0, 210, 255, 0.85);
      color: #000;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .movie-info { padding: 10px; flex-grow: 1; }
    .movie-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-year {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 2px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      padding: 0 10px 10px 10px;
    }
    .card-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-align: center;
    }
    .btn-stream {
      background: rgba(0, 210, 255, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-download {
      background: rgba(0, 230, 118, 0.15);
      color: var(--download-green);
      border: 1px solid var(--download-green);
    }

    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 15px;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      z-index: 10;
    }
    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .player-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .modal-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #11131a;
      flex-wrap: wrap;
      gap: 10px;
    }
    .server-switcher { display: flex; gap: 8px; align-items: center; }
    .server-switcher span { font-size: 0.8rem; color: var(--text-muted); }
    .server-btn {
      background: #1e2230;
      border: none;
      color: #fff;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .server-btn.active {
      background: var(--accent);
      color: #0b0c10;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="location.reload()">Movie<span>Box</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search any movie...">
    </div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="loadByLanguage('all', 'Trending All')">🔥 All Trending</button>
    <button class="filter-btn" onclick="loadByLanguage('ml', 'Malayalam Movies')">🌴 Malayalam</button>
    <button class="filter-btn" onclick="loadByLanguage('ta', 'Tamil Movies')">🎬 Tamil</button>
    <button class="filter-btn" onclick="loadByLanguage('te', 'Telugu Movies')">⚡ Telugu</button>
    <button class="filter-btn" onclick="loadByLanguage('hi', 'Hindi Movies')">🌟 Hindi</button>
    <button class="filter-btn" onclick="loadByLanguage('en', 'Hollywood Movies')">🍿 Hollywood</button>
  </div>

  <section class="hero" id="heroBanner">
    <div class="hero-content">
      <div class="hero-tag" id="heroTag">FEATURED</div>
      <h1 id="heroTitle">Loading...</h1>
      <p id="heroDesc"></p>
      <div class="hero-actions">
        <button class="action-btn play-btn" id="heroPlayBtn">▶ Stream Now</button>
        <button class="action-btn download-btn" id="heroDownloadBtn">⬇ Download Movie</button>
      </div>
    </div>
  </section>

  <main>
    <div class="section-title" id="sectionHeading">Trending Movies</div>
    <div class="movie-grid" id="movieGrid"></div>
  </main>

  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <div class="player-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      </div>
      <div class="modal-toolbar">
        <div class="server-switcher">
          <span>Server:</span>
          <button class="server-btn active" onclick="switchServer(1)">Server 1</button>
          <button class="server-btn" onclick="switchServer(2)">Server 2</button>
          <button class="server-btn" onclick="switchServer(3)">Server 3</button>
        </div>
        <button class="action-btn download-btn" id="modalDownloadBtn" style="padding: 6px 16px; font-size: 0.8rem;">
          ⬇ Download Video
        </button>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "4202ab5f0ea390e81172b29cceca6795";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_URL = "https://image.tmdb.org/t/p/original";

    let activeMediaId = null;
    let featuredMedia = null;

    const movieGrid = document.getElementById('movieGrid');
    const heroBanner = document.getElementById('heroBanner');
    const heroTitle = document.getElementById('heroTitle');
    const heroDesc = document.getElementById('heroDesc');
    const heroPlayBtn = document.getElementById('heroPlayBtn');
    const heroDownloadBtn = document.getElementById('heroDownloadBtn');
    const modalDownloadBtn = document.getElementById('modalDownloadBtn');
    const heroTag = document.getElementById('heroTag');
    const sectionHeading = document.getElementById('sectionHeading');
    const searchInput = document.getElementById('searchInput');
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const closeModal = document.getElementById('closeModal');

    // പുതിയ ഡൗൺലോഡ് സിസ്റ്റം
    function triggerDownload(tmdbId, title = '') {
      const movieName = encodeURIComponent(title || 'Movie');
      const directServer = `https://www.2embed.cc/embed/${tmdbId}`;
      const telegramSearch = `https://t.me/s/search?q=${movieName}`;

      const userChoice = confirm(
        `"${title}" ഡൗൺലോഡ് ചെയ്യാൻ തിരഞ്ഞെടുക്കുക:\n\n` +
        `[OK] - വെബ് പ്ലെയർ & ഡയറക്റ്റ് ഡൗൺലോഡ്\n` +
        `[Cancel] - ടെലിഗ്രാം വഴി ഡൗൺലോഡ്`
      );

      if (userChoice) {
        window.open(directServer, '_blank');
      } else {
        window.open(telegramSearch, '_blank');
      }
    }

    async function fetchData(endpoint) {
      try {
        const sep = endpoint.includes('?') ? '&' : '?';
        const res = await fetch(`${BASE_URL}${endpoint}${sep}api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        return data.results || [];
      } catch (e) {
        console.error("API Error:", e);
        return [];
      }
    }

    async function loadByLanguage(langCode, label) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase().includes(label.split(' ')[0].toLowerCase()));
      });

      sectionHeading.textContent = label;

      let items = [];
      if (langCode === 'all') {
        items = await fetchData(`/trending/movie/day?language=en-US`);
      } else {
        items = await fetchData(`/discover/movie?with_original_language=${langCode}&sort_by=popularity.desc`);
      }

      if (items.length > 0) {
        setHero(items[0], label);
        renderList(items);
      } else {
        movieGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No movies found.</p>`;
      }
    }

    function setHero(item, label) {
      featuredMedia = item;
      heroTitle.textContent = item.title || item.name;
      heroDesc.textContent = item.overview || "No plot summary available.";
      heroTag.textContent = label.toUpperCase();
      if (item.backdrop_path) {
        heroBanner.style.backgroundImage = `linear-gradient(180deg, rgba(11,12,16,0.3) 0%, var(--bg) 98%), url('${BACKDROP_URL + item.backdrop_path}')`;
      }
    }

    function renderList(items) {
      movieGrid.innerHTML = '';
      items.forEach(item => {
        if (!item.poster_path) return;
        const cleanTitle = (item.title || item.name || '').replace(/'/g, "\\'");
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <div class="poster-wrap" onclick="openStreaming(${item.id})">
            <img src="${IMG_URL + item.poster_path}" alt="${item.title}" loading="lazy">
            <div class="lang-badge">${item.original_language || 'EN'}</div>
            <div class="rating-badge">★ ${(item.vote_average || 0).toFixed(1)}</div>
          </div>
          <div class="movie-info">
            <div class="movie-title">${item.title}</div>
            <div class="movie-year">${(item.release_date || '').split('-')[0]}</div>
          </div>
          <div class="card-actions">
            <button class="card-btn btn-stream" onclick="openStreaming(${item.id})">▶ Play</button>
            <button class="card-btn btn-download" onclick="triggerDownload(${item.id}, '${cleanTitle}')">⬇ Save</button>
          </div>
        `;
        movieGrid.appendChild(card);
      });
    }

    function openStreaming(id) {
      activeMediaId = id;
      switchServer(1);
      videoModal.style.display = 'flex';
    }

    function switchServer(serverNum) {
      document.querySelectorAll('.server-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === serverNum - 1);
      });

      if (!activeMediaId) return;

      if (serverNum === 1) {
        videoPlayer.src = `https://www.2embed.cc/embed/${activeMediaId}`;
      } else if (serverNum === 2) {
        videoPlayer.src = `https://vidsrc.me/embed/movie?tmdb=${activeMediaId}`;
      } else if (serverNum === 3) {
        videoPlayer.src = `https://embed.smashystream.com/playere.php?tmdb=${activeMediaId}`;
      }
    }

    heroPlayBtn.addEventListener('click', () => {
      if (featuredMedia) openStreaming(featuredMedia.id);
    });

    heroDownloadBtn.addEventListener('click', () => {
      if (featuredMedia) triggerDownload(featuredMedia.id, featuredMedia.title || featuredMedia.name);
    });

    modalDownloadBtn.addEventListener('click', () => {
      if (activeMediaId) triggerDownload(activeMediaId);
    });

    closeModal.addEventListener('click', () => {
      videoModal.style.display = 'none';
      videoPlayer.src = '';
    });

    window.addEventListener('click', (e) => {
      if (e.target === videoModal) {
        videoModal.style.display = 'none';
        videoPlayer.src = '';
      }
    });

    let searchTimer;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      const query = e.target.value.trim();
      searchTimer = setTimeout(async () => {
        if (query) {
          sectionHeading.textContent = `Search results for "${query}"`;
          const results = await fetchData(`/search/movie?query=${encodeURIComponent(query)}`);
          renderList(results);
        } else {
          loadByLanguage('all', 'Trending All');
        }
      }, 400);
    });

    loadByLanguage('all', 'Trending All');
  </script>
</body>
</html>
