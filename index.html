<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibely - Music for everyone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            base: '#121212',
                            elevated: '#181818',
                            hover: '#282828',
                            green: '#1DB954',
                            greenHover: '#1ed760',
                            textSub: '#a7a7a7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 12px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; border: 3px solid #121212; }
        .custom-scroll:hover::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #a7a7a7; }
        
        /* Progress Bar Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -4px; opacity: 0; transition: opacity 0.2s;
        }
        input[type=range]:hover::-webkit-slider-thumb { opacity: 1; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 2px;
        }
        input[type=range]:hover::-webkit-slider-runnable-track { background: #1DB954; }
        
        /* Hide YouTube iframe controls */
        #yt-wrapper iframe { pointer-events: none; }
    </style>
</head>
<body class="h-screen flex flex-col p-2 gap-2 select-none">

    <!-- LOGIN SCREEN (From your Firebase code) -->
    <div id="login-screen" class="fixed inset-0 bg-spotify-base z-50 flex flex-col items-center justify-center p-4 hidden">
        <div class="bg-spotify-elevated p-8 rounded-2xl shadow-2xl border border-gray-800 max-w-md w-full text-center">
            <div class="w-16 h-16 bg-spotify-green rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-spotify-green/30">
                <i class="fa-solid fa-headphones-simple text-black text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-1" id="authTitle">Welcome to VIBELY</h1>
            <p class="text-spotify-textSub text-sm mb-6" id="authSubtitle">Log in to continue.</p>
            
            <div id="loginForm" class="space-y-3">
                <input type="email" id="loginEmail" placeholder="Email address" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <button onclick="handleLoginSubmit()" class="w-full bg-spotify-green hover:bg-spotify-greenHover text-black font-bold py-3 rounded-full transition mt-4">
                    Log In
                </button>
                <p class="text-sm text-spotify-textSub mt-4">Don't have an account? <button onclick="switchAuthMode('signup')" class="text-white hover:underline font-semibold">Sign up for Vibely</button></p>
            </div>

            <div id="signupForm" class="space-y-3 hidden">
                <input type="text" id="signupName" placeholder="Name" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <input type="email" id="signupEmail" placeholder="Email address" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <input type="password" id="signupPassword" placeholder="Password" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <button onclick="handleSignupSubmit()" class="w-full bg-spotify-green hover:bg-spotify-greenHover text-black font-bold py-3 rounded-full transition mt-4">
                    Sign Up
                </button>
                <p class="text-sm text-spotify-textSub mt-4">Already have an account? <button onclick="switchAuthMode('login')" class="text-white hover:underline font-semibold">Log in</button></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP GRID -->
    <div class="flex flex-1 gap-2 h-[calc(100vh-100px)]">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-spotify-base rounded-lg flex flex-col hidden md:flex">
            <!-- Logo -->
            <div class="p-6 flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                <div class="w-8 h-8 bg-black border-2 border-spotify-green rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-headphones-simple text-spotify-green text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Vibely</span>
            </div>

            <!-- Navigation -->
            <nav class="px-3 space-y-1">
                <button onclick="navigate('home')" id="nav-home" class="w-full flex items-center gap-4 px-4 py-2 text-spotify-textSub hover:text-white font-bold transition group">
                    <i class="fa-solid fa-house text-xl group-[.active]:text-white"></i> Home
                </button>
                <button onclick="navigate('search')" id="nav-search" class="w-full flex items-center gap-4 px-4 py-2 text-spotify-textSub hover:text-white font-bold transition group">
                    <i class="fa-solid fa-magnifying-glass text-xl group-[.active]:text-white"></i> Search
                </button>
            </nav>

            <div class="h-[1px] bg-gray-800 mx-5 my-4"></div>

            <!-- Library / Playlists -->
            <div class="flex-1 overflow-y-auto custom-scroll px-3">
                <button onclick="navigate('liked')" id="nav-liked" class="w-full flex items-center gap-4 px-4 py-2 text-spotify-textSub hover:text-white font-bold transition group">
                    <div class="w-6 h-6 bg-gradient-to-br from-indigo-500 to-blue-300 rounded flex items-center justify-center">
                        <i class="fa-solid fa-heart text-white text-[10px]"></i>
                    </div> Liked Songs
                </button>
                <button onclick="navigate('history')" id="nav-history" class="w-full flex items-center gap-4 px-4 py-2 text-spotify-textSub hover:text-white font-bold transition group">
                    <div class="w-6 h-6 bg-gray-800 rounded flex items-center justify-center">
                        <i class="fa-solid fa-clock-rotate-left text-white text-[10px]"></i>
                    </div> History
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 bg-spotify-base rounded-lg flex flex-col relative overflow-hidden
