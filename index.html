<!DOCTYPE html>

<head>

    <title>VIBELY - Spotify Edition</title>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotifyGreen: '#1DB954',

                        spotifyCard: '#181818',

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCM_1-W2fc1fu8vAT-bJmJuVkl0KGRsvWg",
            authDomain: "vibely-488d8.firebaseapp.com",
            projectId: "vibely-488d8",
            storageBucket: "vibely-488d8.firebasestorage.app",
            messagingSenderId: "1038725355357",
            appId: "1:1038725355357:web:e4e190957f3c4ee2e87ab4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
        window.updateDoc = updateDoc;

        onAuthStateChanged(auth, async (user) => {
            const splash = document.getElementById('splash-screen');
            if (user) {
                window.currentUid = user.uid;
                const userDocRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    window.currentUserName = userSnap.data().name || "User";
                } else {
                    window.currentUserName = "User";
                }
                
                document.getElementById('login-screen').style.display = 'none';
                initApp();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }

            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 600);
            }
        });
    </script>

    <!-- VIBELY CLEAN SPOTIFY SCRIPT -->
    <script>
        let currentPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let activeContainerId = 'songsGrid';
        let timerInterval = null;
        let songCurrentTime = 0;
        let songDuration = 180;

        let favorites = [];
        let playlists = [];

        function switchAuthMode(mode) {
            if(mode === 'signup') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Sign up to Vibely';
                document.getElementById('authSubtitle').innerText = 'Sign up with Email & Password';
            } else {
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Log in to VIBELY';
                document.getElementById('authSubtitle').innerText = 'Continue with Email & Password';
            }
        }

        async function handleSignupSubmit() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            if(!name || !email || !password) {
                alert("Please fill in all fields!");
                return;
            }

            try {
                const userCredential = await window.createUserWithEmailAndPassword(window.auth, email, password);
                const uid = userCredential.user.uid;

                await window.setDoc(window.doc(window.db, "users", uid), {
                    name,
                    email,
                    favorites: [],
                    playlists: []
                });

                document.getElementById('login-screen').style.display = 'none';
            } catch (error) {
                alert("Signup failed: " + error.message);
            }
        }

        async function handleLoginSubmit() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if(!email || !password) {
                alert("Please enter email and password!");
                return;
            }

            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
                document.getElementById('login-screen').style.display = 'none';
            } catch (error) {
                alert("Login failed: Invalid email or password!");
            }
        }

        async function handleLogout() {
            try {
                await window.signOut(window.auth);
                location.reload();
            } catch (e) {
                console.error(e);
            }
        }

        async function initApp() {
            document.getElementById('userNameDisplay').innerText = window.currentUserName;
            document.getElementById('userAvatar').innerText = window.currentUserName.substring(0, 2).toUpperCase();
            
            try {
                const userDoc = await window.getDoc(window.doc(window.db, "users", window.currentUid));
                if(userDoc.exists()) {
                    favorites = userDoc.data().favorites || [];
                    playlists = userDoc.data().playlists || [];
                }
            } catch(e) {
                console.error("Error loading user data:", e);
            }

            searchYouTubeMusicQuery("Malayalam Hits 2026");
        }

        function toggleMenu() {
            const menu = document.getElementById('logoMenu');
            menu.classList.toggle('hidden');
        }

        function closeMenu() {
            document.getElementById('logoMenu').classList.add('hidden');
        }

        window.addEventListener('click', (e) => {
            const menu = document.getElementById('logoMenu');
            const logo = e.target.closest('header .relative');
            if (!logo && menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
            }
        });

        function showStatus(text, show = true) {
            const box = document.getElementById('statusMessage');
            const span = document.getElementById('statusText');
            if(show) {
                span.innerText = text;
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        function quickSearch(queryName) {
            document.getElementById('searchInput').value = queryName;
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            switchTab('home');
            document.getElementById('sectionHeading').innerText = `Vibely Tracks for "${query}"`;
            searchYouTubeMusicQuery(query);
        }

        const YT_MUSIC_APIS = [
            { url: q => `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=music_songs`, name: 'YT Music Kavin', parser: 'piped' },
            { url: q => `https://pipedapi.moomoo.me/search?q=${encodeURIComponent(q)}&filter=music_songs`, name: 'YT Music MooMoo', parser: 'piped' },
            { url: q => `https://pipedapi.adminforge.de/search?q=${encodeURIComponent(q)}&filter=music_songs`, name: 'YT Music Admin', parser: 'piped' },
            { url: q => `https://api.piped.private.coffee/search?q=${encodeURIComponent(q)}&filter=music_songs`, name: 'YT Music Private', parser: 'piped' },
            { url: q => `https://pipedapi.ducks.party/search?q=${encodeURIComponent(q)}&filter=music_songs`, name: 'YT Music Ducks', parser: 'piped' },
            { url: q => `https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(q)}&type=video&music=1`, name: 'YT Music Nadeko', parser: 'invidious' },
            { url: q => `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q)}&type=video`, name: 'YT Music NerdVPN', parser: 'invidious' },
        ];

        async function searchYouTubeMusicFast(query) {
            for (let api of YT_MUSIC_APIS) {
                try {
                    const c = new AbortController();
                    setTimeout(() => c.abort(), 3500);
                    const res = await fetch(api.url(query), { signal: c.signal });
                    if (!res.ok) continue;
                    const data = await res.json();
                    let songs = [];
                    
                    if (api.parser === 'piped') {
                        const items = data.items || data || [];
                        songs = items.filter(i => i.type === 'stream' || i.url?.includes('/watch')).map(item => {
                            const vId = item.url?.split('v=')[1] || item.id;
                            return {
                                videoId: vId,
                                title: item.title,
                                artist: item.uploaderName || item.uploader || "Vibely Artist",
                                image: `https://i.ytimg.com/vi/${vId}/hqdefault.jpg`,
                                duration: item.duration || 180
                            };
                        });
                    } else if (api.parser === 'invidious' && Array.isArray(data)) {
                        songs = data.map(item => {
                            const vId = item.videoId;
                            return {
                                videoId: vId,
                                title: item.title,
                                artist: item.author,
                                image: `https://i.ytimg.com/vi/${vId}/hqdefault.jpg`,
                                duration: item.lengthSeconds || 180
                            };
                        });
                    }
                    
                    songs = songs.filter(s => s.videoId && s.videoId.length > 5);
                    if (songs.length > 0) return songs;
                } catch (e) {
                    continue;
                }
            }
            return [];
        }

        async function searchYouTubeMusicQuery(query) {
            showStatus(`Searching Vibely: ${query}... ⚡`, true);
            const songs = await searchYouTubeMusicFast(query);
            showStatus("", false);
            if (songs.length > 0) {
                currentPlaylist = songs;
                renderSongs(songs, 'songsGrid');
            } else {
                currentPlaylist = [
                    { videoId: "X7Xv4wHw2lw", title: query + " - Full Song", artist: "Vibely", image: "https://i.ytimg.com/vi/X7Xv4wHw2lw/hqdefault.jpg", duration: 180 }
                ];
                renderSongs(currentPlaylist, 'songsGrid');
            }
        }

        function renderSongs(songs, containerId) {
            const grid = document.getElementById(containerId);
            if(!songs || songs.length === 0) {
                grid.innerHTML = `<p class="text-neutral-400 text-sm col-span-full">No songs found.</p>`;
                return;
            }

            grid.innerHTML = songs.map((song, idx) => {
                const isFav = favorites.some(f => f.videoId === song.videoId);
                const safeImg = `https://i.ytimg.com/vi/${song.videoId}/hqdefault.jpg`;
                return `
                    <div class="bg-spotifyCard hover:bg-spotifyCardHover p-4 rounded-md cursor-pointer transition-all duration-300 group shadow-lg relative flex flex-col">
                        <div class="relative mb-3 overflow-hidden rounded aspect-square shadow" onclick="playSongByIndex('${containerId}', ${idx})">
                            <img src="${safeImg}" onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300'" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <button class="absolute bottom-2 right-2 w-10 h-10 bg-spotifyGreen text-black rounded-full flex items-center justify-center shadow-2xl opacity-0 group-hover:opacity-100 transition-all duration-300 translate-y-2 group-hover:translate-y-0">
                                <i class="fa-solid fa-play text-xs ml-0.5"></i>
                            </button>
                        </div>
                        <div class="flex items-start justify-between mt-1">
                            <div onclick="playSongByIndex('${containerId}', ${idx})" class="overflow-hidden flex-1 pr-2">
                                <h3 class="font-bold text-sm text-white truncate">${song.title}</h3>
                                <p class="text-xs text-neutral-400 truncate mt-1">${song.artist}</p>
                            </div>
                            <button onclick="toggleFavorite('${song.videoId}', '${encodeURIComponent(song.title)}', '${encodeURIComponent(song.artist)}', '${encodeURIComponent(safeImg)}')" class="text-neutral-400 hover:text-white transition p-1">
                                <i class="${isFav ? 'fa-solid text-spotifyGreen' : 'fa-regular'} fa-heart text-base"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function toggleFavorite(videoId, titleEnc, artistEnc, imgEnc) {
            const song = {
                videoId,
                title: decodeURIComponent(titleEnc),
                artist: decodeURIComponent(artistEnc),
                image: decodeURIComponent(imgEnc)
            };

            const index = favorites.findIndex(f => f.videoId === videoId);
            if(index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(song);
            }

            try {
                await window.updateDoc(window.doc(window.db, "users", window.currentUid), {
                    favorites: favorites
                });
            } catch(e) {
                console.error("Error saving favorites to Firebase:", e);
            }
            
            if(!document.getElementById('view-favorites').classList.contains('hidden')) {
                renderSongs(favorites, 'favoritesGrid');
            } else {
                renderSongs(currentPlaylist, 'songsGrid');
            }
        }

        async function createNewPlaylist() {
            const name = prompt("Enter playlist name:");
            if(!name) return;
            playlists.push({ name, songs: [] });
            
            try {
                await window.updateDoc(window.doc(window.db, "users", window.currentUid), {
                    playlists: playlists
                });
            } catch(e) {
                console.error("Error saving playlist:", e);
            }
            renderPlaylists();
        }

        function renderPlaylists() {
            const grid = document.getElementById('playlistsGrid');
            if(playlists.length === 0) {
                grid.innerHTML = `<p class="text-xs text-neutral-400">No playlists created yet. Click '+' above.</p>`;
                return;
            }

            grid.innerHTML = playlists.map((pl, pIdx) => `
                <div class="bg-spotifyCard p-4 rounded-md shadow-md">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-bold text-base text-white"><i class="fa-solid fa-list-music text-spotifyGreen mr-2"></i>${pl.name}</h3>
                        <span class="text-xs bg-neutral-800 text-spotifyGreen font-semibold px-2 py-0.5 rounded-full">${pl.songs.length} songs</span>
                    </div>
                    <div class="space-y-2 max-h-40 overflow-y-auto no-scrollbar mb-3">
                        ${pl.songs.length === 0 ? '<p class="text-xs text-neutral-500">Playlist is empty</p>' : pl.songs.map((s, sIdx) => `
                            <div class="flex items-center justify-between text-xs py-1 border-b border-neutral-800">
                                <span class="truncate text-neutral-300 pr-2">${s.title}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // === SPOTIFY PLAYER PLAYBACK ===
        async function playSongByIndex(containerId, index) {
            activeContainerId = containerId;
            let list = currentPlaylist;
            if(containerId === 'favoritesGrid') list = favorites;
            
            if(!list[index]) return;
            currentIndex = index;
            currentPlaylist = list;
            const song = list[index];

            const container = document.getElementById('player-container');
            document.getElementById('player-title').innerText = song.title;
            document.getElementById('player-artist').innerText = song.artist;
            document.getElementById('player-thumb').src = `https://i.ytimg.com/vi/${song.videoId}/hqdefault.jpg`;
            
            container.innerHTML = `
                <iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/${song.videoId}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
            
            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.classList.remove('hidden');
            downloadBtn.classList.add('flex');
            downloadBtn.href = `https://www.youtube.com/watch?v=${song.videoId}`;

            isPlaying = true;
            document.getElementById('play-pause-icon').className = "fa-solid fa-pause text-xs";
            showStatus("Playing via Spotify Player ✓", true);
            setTimeout(()=>showStatus("", false), 1500);

            songCurrentTime = 0;
            songDuration = song.duration || 180;
            if(timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if(isPlaying) {
                    songCurrentTime += 1;
                    if(songCurrentTime > songDuration) {
                        playNext();
                        return;
                    }
                    const progressBar = document.getElementById('progress-bar');
                    if(progressBar) {
                        progressBar.value = (songCurrentTime / songDuration) * 100;
                        document.getElementById('current-time').innerText = formatTime(songCurrentTime);
                        document.getElementById('duration').innerText = formatTime(songDuration);
                    }
                }
            }, 1000);
        }

        function togglePlayPause() {
            if(!currentPlaylist[currentIndex]) {
                if(currentPlaylist.length > 0) playSongByIndex(activeContainerId, 0);
                return;
            }
            const container = document.getElementById('player-container');
            const song = currentPlaylist[currentIndex];

            if(isPlaying) {
                isPlaying = false;
                document.getElementById('play-pause-icon').className = "fa-solid fa-play text-xs ml-0.5";
                container.innerHTML = `<span class="text-[10px] text-neutral-400">Paused</span>`;
            } else {
                isPlaying = true;
                document.getElementById('play-pause-icon').className = "fa-solid fa-pause text-xs";
                container.innerHTML = `
                    <iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/${song.videoId}?autoplay=1&start=${Math.floor(songCurrentTime)}&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                `;
            }
        }

        function playNext() {
            if(currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            playSongByIndex(activeContainerId, currentIndex);
        }

        function playPrevious() {
            if(currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSongByIndex(activeContainerId, currentIndex);
        }

        document.getElementById('progress-bar').addEventListener('change', (e) => {
            if(songDuration && currentPlaylist[currentIndex]) {
                songCurrentTime = Math.floor((e.target.value / 100) * songDuration);
                const song = currentPlaylist[currentIndex];
                const container = document.getElementById('player-container');
                if(isPlaying) {
                    container.innerHTML = `
                        <iframe class="w-full h-full rounded" src="https://www.youtube.com/embed/${song.videoId}?autoplay=1&start=${songCurrentTime}&rel=0&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    `;
                }
            }
        });

        function formatTime(seconds) {
            if(isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function switchTab(tab) {
            ['home', 'favorites', 'playlists'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                if(view) view.classList.add('hidden');
                if(nav) {
                    nav.classList.remove('bg-[#282828]', 'text-white');
                    nav.classList.add('text-neutral-400', 'hover:text-white');
                }
            });

            const activeView = document.getElementById(`view-${tab}`);
            const activeNav = document.getElementById(`nav-${tab}`);
            if(activeView) activeView.classList.remove('hidden');
            if(activeNav) {
                activeNav.classList.add('bg-[#282828]', 'text-white');
                activeNav.classList.remove('text-neutral-400', 'hover:text-white');
            }

            if(tab === 'favorites') {
                renderSongs(favorites, 'favoritesGrid');
            } else if(tab === 'playlists') {
                renderPlaylists();
            } else if(tab === 'home') {
                document.getElementById('sectionHeading').innerText = "Vibely Tracks";
            }
        }
    </script>
</body>
</html>
