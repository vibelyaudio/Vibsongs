<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibely - Music for everyone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            base: '#000000',
                            elevated: '#121212',
                            hover: '#282828',
                            green: '#1DB954',
                            greenHover: '#1ed760',
                            textSub: '#a7a7a7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 12px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; border: 3px solid #121212; }
        .custom-scroll:hover::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #a7a7a7; }
        
        /* Progress Bar Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -4px; opacity: 0; transition: opacity 0.2s;
        }
        input[type=range]:hover::-webkit-slider-thumb { opacity: 1; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.3); border-radius: 2px;
        }
        input[type=range]:hover::-webkit-slider-runnable-track { background: #1DB954; }
        
        /* Hide initially */
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="h-screen flex flex-col p-2 gap-2 select-none">

    <!-- LOGIN SCREEN (Firebase) -->
    <div id="login-screen" class="fixed inset-0 bg-spotify-base z-50 flex flex-col items-center justify-center p-4 hidden">
        <div class="bg-spotify-elevated p-8 rounded-2xl shadow-2xl border border-gray-800 max-w-md w-full text-center">
            <div class="w-16 h-16 bg-spotify-green rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-spotify-green/30">
                <i class="fa-solid fa-headphones-simple text-black text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-1" id="authTitle">Welcome to VIBELY</h1>
            <p class="text-spotify-textSub text-sm mb-6" id="authSubtitle">Log in to continue.</p>
            
            <!-- Login Form -->
            <div id="loginForm" class="space-y-3">
                <input type="email" id="loginEmail" placeholder="Email address" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <button onclick="handleLoginSubmit()" class="w-full bg-spotify-green hover:bg-spotify-greenHover text-black font-bold py-3 rounded-full transition mt-4">
                    Log In
                </button>
                <p class="text-sm text-spotify-textSub mt-4">Don't have an account? <button onclick="switchAuthMode('signup')" class="text-white hover:underline font-semibold">Sign up for Vibely</button></p>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="space-y-3 hidden">
                <input type="text" id="signupName" placeholder="Name" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <input type="email" id="signupEmail" placeholder="Email address" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <input type="password" id="signupPassword" placeholder="Password" class="w-full bg-spotify-base text-white text-sm rounded px-4 py-3 border border-gray-700 focus:outline-none focus:border-spotify-green focus:ring-1 focus:ring-spotify-green">
                <button onclick="handleSignupSubmit()" class="w-full bg-spotify-green hover:bg-spotify-greenHover text-black font-bold py-3 rounded-full transition mt-4">
                    Sign Up
                </button>
                <p class="text-sm text-spotify-textSub mt-4">Already have an account? <button onclick="switchAuthMode('login')" class="text-white hover:underline font-semibold">Log in</button></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP GRID -->
    <div class="flex flex-1 gap-2 h-[calc(100vh-100px)]">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-spotify-elevated rounded-lg flex flex-col hidden md:flex">
            <div class="p-6 flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
                <div class="w-8 h-8 bg-black border-2 border-spotify-green rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-headphones-simple text-spotify-green text-sm"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Vibely</span>
            </div>

            <nav class="px-3 space-y-1">
                <button onclick="navigate('home')" id="nav-home" class="w-full flex items-center gap-4 px-4 py-2 text-white font-bold transition">
                    <i class="fa-solid fa-house text-xl"></i> Home
                </button>
                <button onclick="navigate('search')" id="nav-search" class="w-full flex items-center gap-4 px-4 py-2 text-spotify-textSub hover:text-white font-bold transition">
                    <i class="fa-solid fa-magnifying-glass text-xl"></i> Search
                </button>
            </nav>

            <div class="h-[1px] bg-gray-800 mx-5 my-4"></div>

            <div class="flex-1 overflow-y-auto custom-scroll px-3">
                <button onclick="navigate('liked')" id="nav-liked" class="w-full flex items-center gap-4 px-4 py-2 text-spotify-textSub hover:text-white font-bold transition">
                    <div class="w-6 h-6 bg-gradient-to-br from-indigo-500 to-blue-300 rounded flex items-center justify-center">
                        <i class="fa-solid fa-heart text-white text-[10px]"></i>
                    </div> Liked Songs
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 bg-spotify-elevated rounded-lg flex flex-col relative overflow-hidden">
            
            <!-- Top Header -->
            <header class="sticky top-0 bg-spotify-elevated/95 backdrop-blur-md px-6 py-4 flex items-center justify-between z-20">
                <div class="flex items-center gap-4">
                    <button class="w-8 h-8 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-black transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="w-8 h-8 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-black transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <!-- Search Input -->
                <div class="relative w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="What do you want to listen to?" 
                        class="w-full bg-[#242424] text-white text-sm rounded-full pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-white/20 transition placeholder-gray-400"
                        onkeypress="if(event.key === 'Enter') handleSearch()">
                </div>

                <!-- User Profile -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 bg-black/50 rounded-full pl-1 pr-2 py-1 cursor-pointer hover:bg-black/80 transition">
                        <div id="userAvatar" class="w-6 h-6 bg-spotify-green rounded-full flex items-center justify-center text-black text-xs font-bold">U</div>
                        <span id="userNameDisplay" class="text-sm font-semibold pr-2">User</span>
                    </div>
                    <button onclick="handleLogout()" class="text-gray-400 hover:text-white transition" title="Logout">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto custom-scroll p-6 pb-24">
                
                <!-- HOME VIEW -->
                <div id="view-home" class="space-y-6">
                    <h2 class="text-2xl font-bold text-white tracking-tight">Trending on Audius</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="homeGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- SEARCH VIEW -->
                <div id="view-search" class="hidden-view space-y-6">
                    <h2 class="text-2xl font-bold text-white tracking-tight" id="searchHeading">Search Results</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="searchGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- LIKED SONGS VIEW -->
                <div id="view-liked" class="hidden-view space-y-6">
                    <h2 class="text-2xl font-bold text-white tracking-tight">Liked Songs</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4" id="likedGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- BOTTOM PLAYER -->
    <footer class="bg-black border-t border-gray-800 px-4 py-3 flex items-center justify-between h-24 z-30">
        <!-- Now Playing Info -->
        <div class="flex items-center gap-4 w-1/4">
            <img id="player-thumb" src="https://via.placeholder.com/60" class="w-14 h-14 rounded-md object-cover shadow-lg border border-gray-800">
            <div class="overflow-hidden">
                <h4 id="player-title" class="text-sm font-bold text-white truncate cursor-pointer hover:underline">Select a song</h4>
                <p id="player-artist" class="text-xs text-spotify-textSub truncate mt-0.5">Audius</p>
            </div>
            <button onclick="toggleLikeCurrent()" id="like-btn" class="ml-2 text-gray-400 hover:text-white transition hidden">
                <i id="like-icon" class="fa-regular fa-heart text-lg"></i>
            </button>
        </div>

        <!-- Playback Controls -->
        <div class="flex flex-col items-center justify-center w-2/4 max-w-xl">
            <div class="flex items-center gap-6 mb-2">
                <button onclick="playPrevious()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-backward-step text-xl"></i></button>
                <button onclick="togglePlayPause()" id="play-btn" class="w-8 h-8 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition shadow-md">
                    <i id="play-pause-icon" class="fa-solid fa-play text-sm ml-0.5"></i>
                </button>
                <button onclick="playNext()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-forward-step text-xl"></i></button>
            </div>
            <div class="w-full flex items-center gap-2 text-xs text-gray-400 font-medium">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- Volume Control -->
        <div class="flex items-center justify-end gap-3 w-1/4 pr-4">
            <i class="fa-solid fa-volume-high text-gray-400"></i>
            <input type="range" id="volume-bar" value="1" min="0" max="1" step="0.01" class="w-24 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
        </div>
    </footer>

    <!-- HTML5 Audio Tag (Hidden) -->
    <audio id="audio-player"></audio>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // നിങ്ങളുടെ Firebase കോൺഫിഗറേഷൻ
        const firebaseConfig = {
            apiKey: "AIzaSyCM_1-W2fc1fu8vAT-bJmJuVkl0KGRsvWg",
            authDomain: "vibely-488d8.firebaseapp.com",
            projectId: "vibely-488d8",
            storageBucket: "vibely-488d8.firebasestorage.app",
            messagingSenderId: "1038725355357",
            appId: "1:1038725355357:web:e4e190957f3c4ee2e87ab4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth; window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.doc = doc; window.setDoc = setDoc; window.getDoc = getDoc; window.updateDoc = updateDoc;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUid = user.uid;
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) window.currentUserName = userSnap.data().name || "User";
                else window.currentUserName = "User";
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('userNameDisplay').innerText = window.currentUserName;
                document.getElementById('userAvatar').innerText = window.currentUserName.substring(0, 2).toUpperCase();
                
                initApp();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
            }
        });
    </script>

    <!-- AUDIUS & APP LOGIC -->
    <script>
        // Audius API Variables
        let audiusHost = 'https://discoveryprovider.audius.co'; // Default fallback
        let currentPlaylist = [];
        let currentIndex = -1;
        let isPlaying = false;
        let likedSongs = [];

        // Audio Player
        const audio = document.getElementById('audio-player');

        // Initialize Audius Host
        async function getAudiusHost() {
            try {
                const res = await fetch('https://api.audius.co');
                const data = await res.json();
                audiusHost = data.data[Math.floor(Math.random() * data.data.length)];
                console.log("Using Audius Host:", audiusHost);
            } catch (e) {
                console.log("Using fallback Audius Host");
            }
        }

        // Fetch Trending Tracks
        async function fetchTrending() {
            try {
                const res = await fetch(`${audiusHost}/v1/tracks/trending?app_name=Vibely&limit=20`);
                const data = await res.json();
                return data.data;
            } catch (e) {
                console.error("Error fetching trending:", e);
                return [];
            }
        }

        // Search Tracks
        async function searchTracks(query) {
            try {
                const res = await fetch(`${audiusHost}/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=Vibely&limit=20`);
                const data = await res.json();
                return data.data;
            } catch (e) {
                console.error("Error searching:", e);
                return [];
            }
        }

        // Initialize App
        async function initApp() {
            await getAudiusHost();
            const trending = await fetchTrending();
            currentPlaylist = trending; // Set default playlist
            renderGrid(trending, 'homeGrid');
        }

        // Render Grid of Songs
        function renderGrid(tracks, containerId) {
            const grid = document.getElementById(containerId);
            if (!tracks || tracks.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 col-span-full">No songs found.</p>`;
                return;
            }

            grid.innerHTML = tracks.map((track, index) => {
                const cover = track.artwork ? track.artwork['480x480'] : 'https://via.placeholder.com/150';
                return `
                    <div class="bg-[#181818] hover:bg-[#282828] p-4 rounded-md transition duration-200 cursor-pointer group relative" onclick="playFromQueue('${containerId}', ${index})">
                        <div class="relative mb-4">
                            <img src="${cover}" class="w-full aspect-square object-cover rounded-md shadow-lg">
                            <button class="absolute bottom-2 right-2 w-10 h-10 bg-spotify-green text-black rounded-full flex items-center justify-center shadow-xl opacity-0 group-hover:opacity-100 transition-all duration-200 transform translate-y-2 group-hover:translate-y-0">
                                <i class="fa-solid fa-play text-sm"></i>
                            </button>
                        </div>
                        <h3 class="text-white font-bold text-sm truncate">${track.title}</h3>
                        <p class="text-spotify-textSub text-xs mt-1 truncate">${track.user.name}</p>
                    </div>
                `;
            }).join('');
        }

        // Playback Logic
        function playFromQueue(containerId, index) {
            if (containerId === 'homeGrid') currentPlaylist = currentPlaylist; // Keep current
            else if (containerId === 'searchGrid') { /* handles inside search function */ }
            else if (containerId === 'likedGrid') currentPlaylist = likedSongs;

            currentIndex = index;
            loadAndPlay(currentPlaylist[index]);
        }

        function loadAndPlay(track) {
            if (!track) return;
            
            // Construct Stream URL
            const streamUrl = `${audiusHost}/v1/tracks/${track.id}/stream?app_name=Vibely`;
            audio.src = streamUrl;
            
            // Update UI
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.user.name;
            document.getElementById('player-thumb').src = track.artwork ? track.artwork['480x480'] : 'https://via.placeholder.com/60';
            
            // Show Like Button
            document.getElementById('like-btn').classList.remove('hidden');
            updateLikeIcon(track.id);

            // Play Audio
            audio.play().then(() => {
                isPlaying = true;
                updatePlayIcon();
            }).catch(err => {
                console.error("Playback error:", err);
                alert("Cannot play this track. It might be region-locked or unavailable.");
            });
        }

        function togglePlayPause() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updatePlayIcon();
        }

        function playNext() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            loadAndPlay(currentPlaylist[currentIndex]);
        }

        function playPrevious() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            loadAndPlay(currentPlaylist[currentIndex]);
        }

        function updatePlayIcon() {
            const icon = document.getElementById('play-pause-icon');
            if (isPlaying) icon.className = "fa-solid fa-pause text-sm";
            else icon.className = "fa-solid fa-play text-sm ml-0.5";
        }

        // Audio Events for Progress Bar
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-bar').value = progress;
            document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('duration').innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            playNext();
        });

        // Seek Control
        document.getElementById('progress-bar').addEventListener('input', (e) => {
            if (!audio.duration) return;
            const seekTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        });

        // Volume Control
        document.getElementById('volume-bar').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Search Logic
        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            navigate('search');
            document.getElementById('searchHeading').innerText = `Search results for "${query}"`;
            
            // Show loading state
            document.getElementById('searchGrid').innerHTML = `<div class="col-span-full text-center py-10"><i class="fa-solid fa-spinner fa-spin text-spotify-green text-3xl mb-4"></i><p class="text-gray-400">Searching Audius...</p></div>`;
            
            const results = await searchTracks(query);
            currentPlaylist = results; // Set queue to search results
            renderGrid(results, 'searchGrid');
        }

        // Navigation
        function navigate(view) {
            ['home', 'search', 'liked'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden-view');
                const nav = document.getElementById(`nav-${v}`);
                if (nav) {
                    nav.classList.remove('text-white');
                    nav.classList.add('text-spotify-textSub');
                }
            });

            document.getElementById(`view-${view}`).classList.remove('hidden-view');
            const activeNav = document.getElementById(`nav-${view}`);
            if (activeNav) {
                activeNav.classList.remove('text-spotify-textSub');
                activeNav.classList.add('text-white');
            }
            
            if (view === 'liked') renderGrid(likedSongs, 'likedGrid');
        }

        // Firebase Auth Handlers
        function switchAuthMode(mode) {
            if (mode === 'signup') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Sign Up';
            } else {
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Welcome to VIBELY';
            }
        }

        async function handleSignupSubmit() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            if (!name || !email || !password) return alert("Please fill all fields");

            try {
                const userCred = await window.createUserWithEmailAndPassword(window.auth, email, password);
                await window.setDoc(window.doc(window.db, "users", userCred.user.uid), {
                    name, email, favorites: []
                });
            } catch (e) { alert("Signup failed: " + e.message); }
        }

        async function handleLoginSubmit() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            try {
                await window.signInWithEmailAndPassword(window.auth, email, password);
            } catch (e) { alert("Login failed: Invalid credentials"); }
        }

        async function handleLogout() {
            await window.signOut(window.auth);
            location.reload();
        }

        // Favorites Logic (Simplified for Firebase)
        async function toggleLikeCurrent() {
            if (currentIndex === -1) return;
            const track = currentPlaylist[currentIndex];
            
            const isLiked = likedSongs.some(t => t.id === track.id);
            if (isLiked) {
                likedSongs = likedSongs.filter(t => t.id !== track.id);
            } else {
                likedSongs.push(track);
            }
            
            // Save to Firebase
            if (window.currentUid) {
                await window.updateDoc(window.doc(window.db, "users", window.currentUid), {
                    favorites: likedSongs
                });
            }
            updateLikeIcon(track.id);
        }

        function updateLikeIcon(trackId) {
            const isLiked = likedSongs.some(t => t.id === trackId);
            const icon = document.getElementById('like-icon');
            icon.className = isLiked ? "fa-solid fa-heart text-lg text-spotify-green" : "fa-regular fa-heart text-lg";
        }
    </script>
</body>
</html>
